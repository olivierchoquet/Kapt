[package]
name = "kapt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
ashpd = "0.11"
gstreamer = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
anyhow = "1"
futures-util = "0.3"
ksni = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
